<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분할매수 백테스터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f5f4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="백테스터">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 왼쪽 조건 패널(고정폭) + 오른쪽 결과. 폰에서는 한 열로 쌓임 */
:root{
  --bg:#f2f4f2; --surface:#ffffff; --fg:#1a1f1c; --muted:#5b665f; --line:#dde2de;
  --accent:#1f5f4f; --accent-fg:#ffffff; --chip:#e9eeea;
  --up:#d12f2f; --down:#2a62c9;
  --font:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111412; --surface:#1a1e1b; --fg:#e8ece9; --muted:#9aa59e; --line:#2a302c;
    --accent:#5cb89f; --accent-fg:#0c1411; --chip:#232925;
    --up:#ff6f64; --down:#6fa3ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111412; --surface:#1a1e1b; --fg:#e8ece9; --muted:#9aa59e; --line:#2a302c;
  --accent:#5cb89f; --accent-fg:#0c1411; --chip:#232925;
  --up:#ff6f64; --down:#6fa3ff; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:20px}
h1{font-size:22px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:13px}
.app{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:880px){.app{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:18px}
.group{display:flex;flex-direction:column;gap:10px;min-width:0}
.group+.group{border-top:1px solid var(--line);padding-top:16px}
.group h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lab{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;min-width:0;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:6px;padding:7px 9px}
input[type=number],.num{font-family:var(--mono);font-size:13px}
textarea{font-family:var(--mono);font-size:12px;min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible,.hm td.cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button,.filebtn{font:inherit;font-size:13px;font-weight:500;border-radius:6px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--fg)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--muted);margin:0}
.hint.warn{color:var(--up)}
details summary{cursor:pointer;font-size:12px;color:var(--muted)}
details textarea{margin-top:8px}
.msg{font-size:12.5px;color:var(--down);min-height:1.2em;margin:0}

.out{display:flex;flex-direction:column;gap:28px;min-width:0}
.sample-note{background:var(--chip);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--muted)}
.headline{display:flex;flex-direction:column;gap:6px}
.headline .lab{letter-spacing:.04em}
.big{font-family:var(--mono);font-size:34px;line-height:1.15;font-weight:500;letter-spacing:-.02em;overflow-wrap:anywhere}
.up{color:var(--up)} .down{color:var(--down)}
.sub{color:var(--muted);font-size:13px}
.sub b{color:var(--fg);font-weight:500}
dl.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 28px;margin:0}
dl.kpi div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
dl.kpi dt{color:var(--muted);font-size:13px}
dl.kpi dd{margin:0;font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
section h3{margin:0 0 2px;font-size:15px;font-weight:700}
section>p.hint{margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.readout{font-family:var(--mono);font-size:12px;color:var(--muted);min-height:1.5em;margin-bottom:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.chart{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 0 0;min-width:0}
.chart svg{display:block;width:100%;height:auto}
.grid{stroke:var(--line);stroke-width:1}
.zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.ax{fill:var(--muted);font:11px var(--mono)}
.hov{stroke:var(--muted);stroke-width:1}
.hit{fill:transparent;touch-action:pan-y}
.l-price{stroke:var(--fg);fill:none;stroke-width:1.4}
.l-strat{stroke:var(--accent);fill:none;stroke-width:2}
.l-bh{stroke:var(--muted);fill:none;stroke-width:1.5;stroke-dasharray:5 4}
.m-buy{fill:var(--up)} .m-sell{fill:var(--down)}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);font-size:12px;background:var(--surface);position:sticky;top:0}
td:first-child,th:first-child,td.l,th.l{text-align:left}
td.mono{font-family:var(--mono);font-size:12px}
.log{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tag{display:inline-block;padding:0 7px;border-radius:99px;font-size:11.5px;font-weight:500;background:var(--chip)}
.tag.b{color:var(--up)} .tag.s{color:var(--down)}
.hm{width:auto;min-width:0}
.hm td.cell{--hue:var(--up);--a:0%;font-family:var(--mono);text-align:center;cursor:pointer;min-width:74px;
  background:color-mix(in srgb,var(--hue) var(--a),var(--surface))}
.hm td.cell.neg{--hue:var(--down)}
.hm td.cell.cur{outline:2px solid var(--fg);outline-offset:-2px}
.hm th.axis{background:transparent;position:static;color:var(--muted)}
.notes{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px}
.notes li+li{margin-top:3px}
.empty{padding:28px 0;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){button{transition:filter .12s}button:hover{filter:brightness(.96)}}
</style>

<div class="wrap">
  <header>
    <h1>분할매수 백테스터</h1>
    <p>종목 CSV에 분할매수·매도 규칙을 적용했을 때의 결과를 계산합니다.</p>
  </header>

  <div class="app">
    <form class="panel" id="form" onsubmit="return false">
      <div class="group">
        <h2>종목과 데이터</h2>
        <div class="row">
          <div class="field"><label for="ticker">종목명 / 티커</label><input type="text" id="ticker" value="예시 종목"></div>
          <div class="field"><label for="cur">통화</label>
            <select id="cur"><option value="KRW">원 (KRW)</option><option value="USD">달러 (USD)</option></select></div>
        </div>
        <div class="field" id="savedWrap" hidden><label for="saved">저장된 종목 (매일 자동 갱신)</label><select id="saved"></select></div>
        <div class="btns">
          <label class="filebtn">CSV 불러오기<input type="file" id="file" accept=".csv,.txt,text/csv"></label>
          <button type="button" id="useSample">예시 데이터</button>
        </div>
        <details>
          <summary>CSV 붙여넣기</summary>
          <textarea id="paste" placeholder="Date,Close&#10;2024-01-02,71000&#10;..."></textarea>
          <div class="btns" style="margin-top:8px"><button type="button" id="usePaste">붙여넣은 데이터 사용</button></div>
        </details>
        <p class="hint" id="dataInfo"></p>
        <p class="hint">야후 파이낸스, 인베스팅닷컴, 증권사에서 내보낸 일봉 CSV를 읽습니다. 날짜와 종가 열이 필요하고, 수정종가(Adj Close)가 있으면 그 열을 씁니다.</p>
        <p class="msg" id="err" role="alert"></p>
        <div class="row">
          <div class="field"><label for="start">시작일</label><input type="date" id="start"></div>
          <div class="field"><label for="end">종료일</label><input type="date" id="end"></div>
        </div>
      </div>

      <div class="group">
        <h2>매수 조건</h2>
        <div class="row">
          <div class="field"><label for="buyPct">하락률 (%)</label><input type="number" id="buyPct" value="5" min="0.1" max="90" step="any" inputmode="decimal"></div>
          <div class="field"><label for="amount">회당 매수 금액</label><input type="number" id="amount" value="1000000" min="1" step="any" inputmode="decimal"></div>
        </div>
        <div class="field"><label for="buyRef">하락 기준</label>
          <select id="buyRef">
            <option value="lastBuy">직전 매수가 대비</option>
            <option value="prevClose">전일 종가 대비</option>
            <option value="peak">직전 매수 이후 고점 대비</option>
          </select></div>
        <div class="row">
          <div class="field"><label for="maxLots">최대 차수</label><input type="number" id="maxLots" value="10" min="1" max="200" step="1" inputmode="numeric"></div>
          <div class="field"><label for="budget">총 투자 한도 (0=무제한)</label><input type="number" id="budget" value="0" min="0" step="any" inputmode="decimal"></div>
        </div>
        <div class="row">
          <div class="field"><label for="stepFrom">증액 시작 차수 (0=끔)</label><input type="number" id="stepFrom" value="0" min="0" max="200" step="1" inputmode="numeric"></div>
          <div class="field"><label for="stepMult">증액 배수</label><input type="number" id="stepMult" value="2" min="0.1" max="20" step="any" inputmode="decimal"></div>
        </div>
        <div class="field"><label for="stepMode">증액 방식</label>
          <select id="stepMode">
            <option value="flat">시작 차수부터 전부 금액 × 배수</option>
            <option value="grow">시작 차수부터 차수마다 배수를 거듭 곱함</option>
          </select></div>
        <p class="hint" id="stepHint"></p>
      </div>

      <div class="group">
        <h2>매도 조건</h2>
        <div class="field"><label for="sellPct">상승률 (%)</label><input type="number" id="sellPct" value="10" min="0.1" max="500" step="any" inputmode="decimal"></div>
        <div class="field"><label for="sellRef">상승 기준</label>
          <select id="sellRef">
            <option value="avg">평단 대비 (전량 매도)</option>
            <option value="lot">차수별 매수가 대비 (해당 차수만 매도)</option>
          </select></div>
      </div>

      <div class="group">
        <h2>비용</h2>
        <div class="field"><label for="fee">매매 수수료 (편도 %)</label><input type="number" id="fee" value="0.05" min="0" max="5" step="any" inputmode="decimal"></div>
        <label class="check"><input type="checkbox" id="frac"> 소수점 매수 허용</label>
        <p class="hint">끄면 회당 금액으로 살 수 있는 정수 주수만 매수합니다.</p>
      </div>
    </form>

    <main class="out" id="out" aria-live="polite"></main>
  </div>
</div>

<script>
/* ===== 백테스트 엔진 (순수 함수) ===== */
function pad2(x){ x = String(x); return x.length < 2 ? '0' + x : x; }
function isoDate(d){ return d.toISOString().slice(0, 10); }

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* 예시용 가상 시계열 (실제 종목 데이터가 아님) */
function sampleData(){
  var r = mulberry32(20261110), p = 50000, rows = [];
  var d = new Date(Date.UTC(2021, 0, 4));
  for (var k = 0; k < 1300; k++){
    while (d.getUTCDay() === 0 || d.getUTCDay() === 6) d = new Date(d.getTime() + 864e5);
    var u1 = r() || 1e-9, u2 = r();
    var z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    var mu = 0.00005 + 0.0014 * Math.sin(k / 170);
    p *= Math.exp(mu + 0.016 * z);
    rows.push({ d: isoDate(d), c: Math.max(10, Math.round(p / 10) * 10) });
    d = new Date(d.getTime() + 864e5);
  }
  return rows;
}

function normDate(s){
  s = String(s == null ? '' : s).replace(/"/g, '').trim();
  var m;
  if ((m = s.match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})/))) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return m[1] + '-' + m[2] + '-' + m[3];
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return m[3] + '-' + pad2(m[1]) + '-' + pad2(m[2]);
  var MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  if ((m = s.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})/)) && MON[m[1].slice(0, 3).toLowerCase()]) return m[3] + '-' + pad2(MON[m[1].slice(0, 3).toLowerCase()]) + '-' + pad2(m[2]);
  if ((m = s.match(/^(\d{1,2})\s+([A-Za-z]{3,9})\.?,?\s+(\d{4})/)) && MON[m[2].slice(0, 3).toLowerCase()]) return m[3] + '-' + pad2(MON[m[2].slice(0, 3).toLowerCase()]) + '-' + pad2(m[1]);
  return null;
}

function splitLine(l, delim){
  var out = [], cur = '', q = false;
  for (var i = 0; i < l.length; i++){
    var ch = l[i];
    if (ch === '"'){
      if (q && l[i + 1] === '"'){ cur += '"'; i++; } else q = !q;
    } else if (ch === delim && !q){ out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(function(s){ return s.trim(); });
}

function toNum(s){
  var v = parseFloat(String(s).replace(/[,\s$₩원]/g, ''));
  return isFinite(v) ? v : NaN;
}

/* CSV → {rows:[{d,c}], colName} */
function parseCSV(text){
  text = String(text).replace(/^﻿/, '').trim();
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim(); });
  if (lines.length < 3) throw new Error('데이터 행이 너무 적습니다. 날짜와 종가 열이 있는 CSV를 올려 주세요.');
  var best = ',', bestN = 0;
  [',', '\t', ';'].forEach(function(ch){
    var n = splitLine(lines[0], ch).length;
    if (n > bestN){ bestN = n; best = ch; }
  });
  var first = splitLine(lines[0], best);
  var hasHeader = !first.some(function(x){ return normDate(x); });
  var dateCol = 0, closeCol = -1, colName = '';
  if (hasHeader){
    var head = first.map(function(s){ return s.toLowerCase(); });
    var di = head.findIndex(function(h){ return /date|날짜|일자|일시|time/.test(h); });
    if (di >= 0) dateCol = di;
    var ai = head.findIndex(function(h){ return /adj|수정/.test(h); });
    var ci = head.findIndex(function(h){ return /^close|종가|현재가|마감|^price|^종가/.test(h) && !/adj|수정/.test(h); });
    if (ai >= 0){ closeCol = ai; colName = first[ai]; }
    else if (ci >= 0){ closeCol = ci; colName = first[ci]; }
  }
  if (closeCol < 0){
    closeCol = first.length >= 5 ? 4 : 1;
    colName = hasHeader ? (first[closeCol] || '') : (closeCol + 1) + '번째 열';
  }
  var rows = [];
  for (var i = hasHeader ? 1 : 0; i < lines.length; i++){
    var cells = splitLine(lines[i], best);
    var d = normDate(cells[dateCol]), c = toNum(cells[closeCol]);
    if (d && isFinite(c) && c > 0) rows.push({ d: d, c: c });
  }
  rows.sort(function(a, b){ return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
  var dedup = [];
  rows.forEach(function(r){
    if (dedup.length && dedup[dedup.length - 1].d === r.d) dedup[dedup.length - 1] = r; else dedup.push(r);
  });
  if (dedup.length < 20) throw new Error('읽을 수 있는 행이 ' + dedup.length + '개뿐입니다. 열 이름(Date, Close 등)을 확인해 주세요.');
  return { rows: dedup, colName: colName };
}

function dayDiff(a, b){
  var pa = a.split('-'), pb = b.split('-');
  return (Date.UTC(+pb[0], +pb[1] - 1, +pb[2]) - Date.UTC(+pa[0], +pa[1] - 1, +pa[2])) / 864e5;
}

/* 보유 차수가 lotNo번째가 되는 매수의 금액. stepFrom=0이면 항상 고정 금액.
   stepMode 'flat': stepFrom차수부터 전부 amount x stepMult
   stepMode 'grow': stepFrom차수에서 x stepMult, 이후 차수마다 stepMult를 한 번씩 더 곱함 */
function lotAmount(o, lotNo){
  var from = o.stepFrom || 0, m = o.stepMult || 1;
  if (!(from > 0) || lotNo < from) return o.amount;
  if (o.stepMode === 'grow') return o.amount * Math.pow(m, lotNo - from + 1);
  return o.amount * m;
}

/*
 o = {buyPct, sellPct, buyRef:'lastBuy'|'prevClose'|'peak', sellRef:'avg'|'lot',
      amount, maxLots, budget(0=무제한), feePct, fractional,
      stepFrom(0=끔), stepMult, stepMode:'flat'|'grow'}
*/
function backtest(rows, o){
  var EPS = 1e-9, fee = (o.feePct || 0) / 100;
  var lots = [], realized = 0, invested = 0, maxInvested = 0, maxLotsHeld = 0;
  var blockedDays = 0, nBuy = 0, nSell = 0, peak = null;
  var trades = [], curve = [];

  for (var i = 0; i < rows.length; i++){
    var c = rows[i].c, d = rows[i].d, sold = false, k, l, pnl, proceeds;

    if (lots.length){
      if (o.sellRef === 'avg'){
        var sh = 0, val = 0, cost = 0;
        for (k = 0; k < lots.length; k++){ sh += lots[k].sh; val += lots[k].sh * lots[k].p; cost += lots[k].cost; }
        var avg = val / sh;
        if (c >= avg * (1 + o.sellPct / 100) - EPS){
          proceeds = sh * c * (1 - fee);
          pnl = proceeds - cost;
          realized += pnl; invested -= cost; nSell++; sold = true;
          trades.push({ i: i, d: d, side: 'S', p: c, sh: sh, amt: sh * c, pnl: pnl, note: lots.length + '차수 전량 (평단 ' + avg.toFixed(2) + ')' });
          lots = [];
        }
      } else {
        var keep = [];
        for (k = 0; k < lots.length; k++){
          l = lots[k];
          if (c >= l.p * (1 + o.sellPct / 100) - EPS){
            proceeds = l.sh * c * (1 - fee);
            pnl = proceeds - l.cost;
            realized += pnl; invested -= l.cost; nSell++; sold = true;
            trades.push({ i: i, d: d, side: 'S', p: c, sh: l.sh, amt: l.sh * c, pnl: pnl, note: l.n + '차수 매수가 ' + l.p });
          } else keep.push(l);
        }
        lots = keep;
      }
    }

    if (!sold){
      var trigger = false;
      if (!lots.length) trigger = true;
      else {
        var ref = null;
        if (o.buyRef === 'lastBuy') ref = lots[lots.length - 1].p;
        else if (o.buyRef === 'prevClose') ref = i > 0 ? rows[i - 1].c : null;
        else ref = peak;
        if (ref != null && c <= ref * (1 - o.buyPct / 100) + EPS) trigger = true;
      }
      if (trigger){
        var lotAmt = lotAmount(o, lots.length + 1);
        var qty = o.fractional ? lotAmt / c : Math.floor(lotAmt / c);
        var capOK = lots.length < o.maxLots;
        var budgetOK = !o.budget || invested + lotAmt * (1 + fee) <= o.budget + EPS;
        if (capOK && budgetOK && qty > 0){
          var bc = qty * c * (1 + fee);
          lots.push({ sh: qty, p: c, cost: bc, n: lots.length + 1 });
          invested += bc; nBuy++; peak = c;
          if (invested > maxInvested) maxInvested = invested;
          if (lots.length > maxLotsHeld) maxLotsHeld = lots.length;
          trades.push({ i: i, d: d, side: 'B', p: c, sh: qty, amt: qty * c, pnl: null, note: lots.length + '차수' });
        } else blockedDays++;
      }
    }

    var mv = 0, shs = 0;
    for (k = 0; k < lots.length; k++){ mv += lots[k].sh * c; shs += lots[k].sh; }
    curve.push({ d: d, c: c, pnl: realized + (mv - invested), inv: invested, n: lots.length });
  }

  var last = curve[curve.length - 1];
  var base = maxInvested > 0 ? maxInvested : 1;
  var bh = curve.map(function(r){ return base * (r.c / rows[0].c - 1); });

  var peakPnl = -Infinity, mdd = 0, minPnl = 0;
  curve.forEach(function(r){
    if (r.pnl > peakPnl) peakPnl = r.pnl;
    if (peakPnl - r.pnl > mdd) mdd = peakPnl - r.pnl;
    if (r.pnl < minPnl) minPnl = r.pnl;
  });

  var totalPnl = last.pnl, retPct = totalPnl / base * 100;
  var years = dayDiff(rows[0].d, rows[rows.length - 1].d) / 365.25;
  var cagr = (years >= 0.25 && 1 + retPct / 100 > 0) ? (Math.pow(1 + retPct / 100, 1 / years) - 1) * 100 : null;
  var openSh = 0, openVal = 0;
  lots.forEach(function(x){ openSh += x.sh; openVal += x.sh * x.p; });

  return {
    trades: trades, curve: curve, bh: bh,
    totalPnl: totalPnl, realized: realized, unrealized: totalPnl - realized,
    maxInvested: maxInvested, retPct: retPct, cagr: cagr, years: years,
    mdd: mdd, mddPct: mdd / base * 100, minPnl: minPnl, minPnlPct: minPnl / base * 100,
    bhPnl: bh[bh.length - 1], bhPct: (rows[rows.length - 1].c / rows[0].c - 1) * 100,
    nBuy: nBuy, nSell: nSell, blockedDays: blockedDays, maxLotsHeld: maxLotsHeld,
    openLots: lots.length, openAvg: openSh ? openVal / openSh : null, openInvested: invested
  };
}

function sweep(rows, o, buyList, sellList){
  return buyList.map(function(b){
    return sellList.map(function(s){
      var r = backtest(rows, Object.assign({}, o, { buyPct: b, sellPct: s }));
      return { b: b, s: s, ret: r.retPct, pnl: r.totalPnl, inv: r.maxInvested };
    });
  });
}

      var apply = function(){ $('buyPct').value = td.dataset.b; $('sellPct').value = td.dataset.s; render(); };
      td.addEventListener('click', apply);
      td.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); apply(); } });
    });

    var tr = res.trades, show = tr.slice(-300).reverse();
    $('logHint').textContent = tr.length ? '총 ' + tr.length + '건' + (tr.length > 300 ? ' 중 최근 300건' : '') + ', 최신순입니다.' : '체결된 매매가 없습니다.';
    var lt = '<table><thead><tr><th>날짜</th><th>구분</th><th>체결가</th><th>수량</th><th>금액</th><th>실현 손익</th><th class="l">비고</th></tr></thead><tbody>';
    show.forEach(function(x){
      lt += '<tr><td class="mono">' + x.d + '</td><td><span class="tag ' + (x.side === 'B' ? 'b">매수' : 's">매도') + '</span></td>' +
            '<td class="mono">' + price(x.p) + '</td><td class="mono">' + (o.fractional ? x.sh.toFixed(3) : Math.round(x.sh).toLocaleString('ko-KR')) + '</td>' +
            '<td class="mono">' + money(x.amt) + '</td><td class="mono ' + (x.pnl == null ? '' : cls(x.pnl)) + '">' + (x.pnl == null ? '-' : money(x.pnl, true)) + '</td>' +
            '<td class="l">' + esc(x.note) + '</td></tr>';
    });
    $('log').innerHTML = lt + '</tbody></table>';
  }

  function schedule(){ clearTimeout(timer); timer = setTimeout(render, 120); }

  /* ---------- 데이터 로드 ---------- */
  function setData(rows, name, sample, colName){
    DATA = rows; SAMPLE = sample; COLNAME = colName || '';
    $('start').value = rows[0].d; $('end').value = rows[rows.length - 1].d;
    $('dataInfo').textContent = (sample ? '예시(가상) 데이터 · ' : '') + rows.length.toLocaleString('ko-KR') + '개 일봉 · ' + rows[0].d + ' ~ ' + rows[rows.length - 1].d + (colName ? ' · 사용한 열: ' + colName : '');
    if (name) $('ticker').value = name;
    render();
  }
  function loadText(text, name){
    try {
      var p = parseCSV(text);
      $('err').textContent = '';
      setData(p.rows, name, false, p.colName);
    } catch (e){ $('err').textContent = e.message; }
  }
  $('file').addEventListener('change', function(ev){
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){ loadText(String(rd.result), f.name.replace(/\.[^.]+$/, '')); };
    rd.onerror = function(){ $('err').textContent = '파일을 읽지 못했습니다. 다시 선택해 주세요.'; };
    rd.readAsText(f);
    ev.target.value = '';
  });
  $('usePaste').addEventListener('click', function(){ loadText($('paste').value, ''); });
  $('useSample').addEventListener('click', function(){ setData(sampleData(), '예시 종목', true, ''); });

  $('cur').addEventListener('change', function(){
    var prev = CUR; CUR = $('cur').value;
    if (parseFloat($('amount').value) === DEFAULTS[prev].amount) $('amount').value = DEFAULTS[CUR].amount;
    if (parseFloat($('fee').value) === DEFAULTS[prev].fee) $('fee').value = DEFAULTS[CUR].fee;
    render();
  });
  ['buyPct','sellPct','buyRef','sellRef','amount','maxLots','budget','fee','frac','start','end','stepFrom','stepMult','stepMode'].forEach(function(id){
    $(id).addEventListener('input', schedule);
    $(id).addEventListener('change', schedule);
  });
  var rt = null;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ if (LAST) render(); }, 150); });

  /* 저장소의 data/ 폴더에 자동 수집된 종목이 있으면 선택 목록을 보여 줌 */
  function loadSavedList(){
    if (!window.fetch) return;
    fetch('data/index.json').then(function(r){ if (!r.ok) throw new Error('no index'); return r.json(); }).then(function(list){
      if (!Array.isArray(list) || !list.length) return;
      var sel = $('saved');
      sel.innerHTML = '<option value="">종목 선택...</option>' + list.map(function(e, i){
        return '<option value="' + i + '">' + esc(e.t) + ' (' + e.first + ' ~ ' + e.last + ')</option>';
      }).join('');
      $('savedWrap').hidden = false;
      sel.addEventListener('change', function(){
        var e = list[parseInt(sel.value, 10)];
        if (!e) return;
        $('err').textContent = '';
        fetch('data/' + encodeURIComponent(e.file)).then(function(r){ if (!r.ok) throw new Error('파일을 찾지 못했습니다: ' + e.file); return r.text(); }).then(function(txt){
          var c = /\.(KS|KQ)$/i.test(e.t) ? 'KRW' : 'USD';
          if ($('cur').value !== c){ $('cur').value = c; $('cur').dispatchEvent(new Event('change')); }
          loadText(txt, e.t);
        }).catch(function(er){ $('err').textContent = er.message; });
      });
    }).catch(function(){ /* data 폴더가 없으면 목록을 숨긴 채로 둠 */ });
  }
  loadSavedList();

  setData(sampleData(), '예시 종목', true, '');
})();
</script>
